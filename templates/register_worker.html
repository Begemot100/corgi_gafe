<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Empleado</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/registration.css') }}">
</head>
<body>
    <div class="registration-container">
        <h1>Registro de Empleado</h1>
        <form action="{{ url_for('register_worker') }}" method="POST">
            <label for="full_name">Nombre completo</label>
            <input type="text" id="full_name" name="full_name" placeholder="Ingrese su nombre completo" required>

            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" placeholder="Ingrese su correo electrónico" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Cree una contraseña" required>

            <button type="submit" class="register-btn">Registrar</button>
        </form>
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
    </div>
</body>
</html>
