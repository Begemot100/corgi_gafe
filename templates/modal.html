<!-- New Employee Modal -->
<div id="modal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeNewEmployeeModal()">&times;</span>
        <h2 id="modal-title">Nuevo empleado</h2>
        <form id="employee-form" action="{{ url_for('add_employee') }}" method="POST">
            <label for="full_name">Nombre completo</label>
            <input type="text" id="full_name" name="full_name" placeholder="Nombre completo" required>

            <label for="nie">NIE</label>
            <input type="text" id="nie" name="nie" placeholder="NIE" required>

            <label for="start_date">Fecha de inicio del contrato</label>
            <input type="date" id="start_date" name="start_date" required>

            <label for="end_date">Fecha de finalización del contrato</label>
            <input type="date" id="end_date" name="end_date">

            <label for="hours_per_week">Horas por semana</label>
            <input type="number" id="hours_per_week" name="hours_per_week" placeholder="Type here" required>

            <label for="days_per_week">Días por semana</label>
            <input type="number" id="days_per_week" name="days_per_week" placeholder="Type here" required>

            <label for="position">Posición</label>
            <select id="position" name="position" required>
                 <option value="Camarero">Camarero</option>
                    <option value="Barman">Barman</option>
                    <option value="Administrador">Administrador</option>
                    <option value="Limpiadora">Limpiadora</option>
                    <option value="Audante de camarero">Audante de camarero</option>
                    <option value="Chef">Chef</option>
                    <option value="Su-Chef">Su-Chef</option>
                    <option value="Cocinero">Cocinero</option>
                    <option value="Audante de cocina">Audante de cocina</option>
            </select>

            <label for="section">Sección</label>
            <select id="section" name="section" required>
                <option value="Cocina">Cocina</option>
                <option value="Sala">Sala</option>
            </select>

            <label for="phone">Número de teléfono</label>
            <input type="text" id="phone" name="phone" placeholder="Número de teléfono" required>

            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" placeholder="Correo electrónico" required>

            <div class="form-buttons">
                <button type="button" class="cancel-btn" onclick="closeNewEmployeeModal()">Cancelar</button>
                <button type="submit" class="save-btn">Guardar</button>
            </div>
        </form>
    </div>
</div>

<!-- Action Modal for Edit/Delete -->
<div id="action-modal1" class="modal1">
    <div class="modal-content1">
        <span class="close" onclick="closeActionModal()">&times;</span>
        <button id="edit-action" onclick="triggerEdit()">Editar</button>
        <button id="delete-action" onclick="triggerDelete()">Eliminar</button>
    </div>
</div>
