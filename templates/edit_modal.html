<div id="editTimeModal" class="editTimeModal" style="display: none;">
    <div class="modal-content">
        <span class="close" onclick="closeEditModal()">&times;</span>
        <h2>Редактировать время</h2>
        <button onclick="openEditModal(employeeId)">Редактировать</button>

        <label for="editDate">Дата</label>
        <select id="editDate" onchange="updateSelectedLogData(this.value, employeeLogs)">
            <!-- Опции дат будут добавлены здесь динамически -->
        </select>
        <label for="editCheckIn">Время начала</label>
        <input type="time" id="editCheckIn">
        <label for="editCheckOut">Время окончания</label>
        <input type="time" id="editCheckOut">
        <div class="form-buttons">
            <button class="cancel-btn" onclick="closeEditModal()">Отмена</button>
            <button class="register-btn" onclick="saveEditedTime()">Сохранить</button>
        </div>
    </div>
</div>
