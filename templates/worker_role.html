<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso de Empleado</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        .container {
            text-align: center;
        }
        .action-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 220px;
            height: 60px;
            font-size: 16px;
            margin: 20px;
            cursor: pointer;
            border-radius: 12px;
            background-color: #FC8C86;
            border: none;
            color: white;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
        }
        .action-btn:hover {
            background-color: #E67A74;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Elija su acción</h1>
        <form action="/dashboard_login" method="GET">
            <button class="action-btn" type="submit">Iniciar sesión</button>
        </form>
        <form action="/register_worker" method="GET">
            <button class="action-btn" type="submit">Registrar</button>
        </form>
    </div>
</body>
</html>
