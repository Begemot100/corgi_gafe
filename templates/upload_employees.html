<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка сотрудников</title>
</head>
<body>
    <h1>Загрузка сотрудников из Excel</h1>
    <form action="/upload_employees" method="POST" enctype="multipart/form-data">
        <label for="file">Выберите Excel-файл:</label>
        <input type="file" name="file" id="file" accept=".xlsx" required>
        <button type="submit">Загрузить</button>
    </form>
</body>
</html>
